version: "3.8"

services:
  nuxt:
    image: your-nuxt-app-image
    container_name: nuxt-app
    build: .
    ports:
      - "3000:3000"
    environment:
      - VIRTUAL_HOST=your-domain.com
      - VIRTUAL_PORT=3000
    networks:
      - web
    # Limit log storage: max 3 files × 5 MB = 15 MB total, then oldest is discarded
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  caddy:
    image: caddy:alpine
    container_name: caddy
    environment:
      - ACME_AGREE=true # Akzeptiere Let's Encrypt TOS automatisch
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web
    # Access logs are disabled in Caddyfile (output discard).
    # This limit covers startup messages and error logs only.
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config:
